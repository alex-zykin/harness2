name: Business offline contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      HARNESS2_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Contracts and real upstream workflow (no dependencies or models)
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Original deterministic upstream demo
        run: python -B -m harness2.cli.demo --output '${{ runner.temp }}/upstream-demo' --k 1
      - name: Business adapter, recursion and frozen holdout
        run: python -B -m harness2.business.demo --dataset examples/business/synthetic.json --output '${{ runner.temp }}/business-demo'
